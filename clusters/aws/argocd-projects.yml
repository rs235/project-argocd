---
apiVersion: argoproj.io/v1alpha1  # Argo CDA API version for Application object.
kind: Application  # K8s object type. In this case ArgoCD Application.
metadata:  # Description of the ArgoCD Application object.
  name: argocd-projects  # Name of the ArgoCD application object.
  namespace: argocd  # K8s namespace for ArgoCD application object.

spec:  # ArgoCD Application specification.
  project: root  # ArgoCD project name for this app.

  source:  # Source of configuration.
    repoURL: https://github.com/rs235/project-argocd.git  # Repo url.
    targetRevision: main  # Repo branch.
    path: projects  # Path in the repo containing app manifests.

  destination:  # Destination cluster.
    server: https://kubernetes.default.svc  # Destination cluster API server address.
    namespace: argocd  # K8s namespace for the app deployment.

  syncPolicy:  # ArgoCD sync policy definition.
    automated:  # Sync policy type.
      prune: true  # Remove resources managed by this Application automatically if they are removed from the repo.
      selfHeal: true  # Manual changes to running app are overwritten with what's in the repo.
