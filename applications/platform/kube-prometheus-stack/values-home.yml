---
grafana:
  enabled: true

  persistence:
    enabled: true
    type: pvc
    storageClassName: longhorn
    accessModes:
      - ReadWriteOnce
    size: 4Gi

  service:
    type: LoadBalancer
    annotations:
      metallb.io/address-pool: default
    loadBalancerIP: 10.10.10.43

prometheus:
  prometheusSpec:
    retention: 15d
    retentionSize: 12GB

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 16Gi

    additionalScrapeConfigs:
      - job_name: pve
        metrics_path: /pve
        params:
          module: [default]
          cluster: ['1']
          node: ['1']
        static_configs:
          - targets:
              - 10.10.10.10
            labels:
              instance: pve
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - target_label: __address__
            replacement: 10.10.10.54:9221

  service:
    type: LoadBalancer
    annotations:
      metallb.io/address-pool: default
    loadBalancerIP: 10.10.10.42

alertmanager:
  enabled: true

  service:
    type: ClusterIP

  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
