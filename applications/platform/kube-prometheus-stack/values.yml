---
grafana:
  enabled: true
  service:
    type: LoadBalancer

prometheus:
  prometheusSpec:
    retention: 15d

    additionalScrapeConfigs:
      - job_name: pve
        metrics_path: /pve

        params:
          module: [default]

        static_configs:
          - targets:
              - pve.home.arpa

        relabel_configs:
          # Pass the Proxmox node address to the exporter.
          - source_labels: [__address__]
            target_label: __param_target

          # Identify metrics by Proxmox node.
          - source_labels: [__param_target]
            target_label: instance

          # Direct scraping to pve-exporter.
          - target_label: __address__
            replacement: "pve-exporter.home.arpa:9221"
  service:
    type: LoadBalancer

alertmanager:
  enabled: true
  service:
    type: LoadBalancer
