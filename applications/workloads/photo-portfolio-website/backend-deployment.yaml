---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: ./kompose convert -f compose.yaml
    kompose.version: 1.38.0 (a8f5d1cbd)

  labels:
    io.kompose.service: backend

  name: backend
  namespace: photo-portfolio-website

spec:
  replicas: 1

  selector:
    matchLabels:
      io.kompose.service: backend

  strategy:
    type: Recreate

  template:
    metadata:
      annotations:
        kompose.cmd: ./kompose convert -f compose.yaml
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: backend

    spec:
      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: backend
          image: rs235/portfolio-website-backend:1795015800
          imagePullPolicy: Always
          env:
            - name: CACHE_DIR
              value: /app/cache
            - name: NODE_ENV
              value: production
            - name: PHOTO_DIR
              value: /app/photos
            - name: PORT
              value: "3000"

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          livenessProbe:
            exec:
              command:
                - node
                - -e
                - |
                  fetch('http://127.0.0.1:3000/api/health')
                    .then(r => process.exit(r.ok ? 0 : 1))
                    .catch(() => process.exit(1))
            failureThreshold: 5
            initialDelaySeconds: 120
            periodSeconds: 15
            timeoutSeconds: 5

          readinessProbe:
            exec:
              command:
                - node
                - -e
                - |
                  fetch('http://127.0.0.1:3000/api/health')
                    .then(r => process.exit(r.ok ? 0 : 1))
                    .catch(() => process.exit(1))

            failureThreshold: 5
            initialDelaySeconds: 120
            periodSeconds: 15
            timeoutSeconds: 5

          ports:
            - containerPort: 3000
              protocol: TCP

          volumeMounts:
            - mountPath: /app/photos
              name: photos
              readOnly: true
            - mountPath: /app/cache
              name: photo-cache
            - mountPath: /tmp
              name: backend-tmpfs0

      restartPolicy: Always

      volumes:
        - name: photos
          persistentVolumeClaim:
            claimName: photos
        - name: photo-cache
          persistentVolumeClaim:
            claimName: photo-cache
        - name: backend-tmpfs0
          emptyDir:
            medium: Memory
