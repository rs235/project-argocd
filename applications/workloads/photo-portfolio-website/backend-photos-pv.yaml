---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: photos
  namespace: photo-portfolio-website

spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: truenas.home.arpa
    path: /mnt/mars/services/portfolio
    readOnly: true
