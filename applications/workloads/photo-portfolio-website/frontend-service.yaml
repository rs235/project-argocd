---
apiVersion: v1
kind: Service
metadata:
  annotations:
    kompose.cmd: ./kompose convert -f compose.yaml
    kompose.version: 1.38.0 (a8f5d1cbd)

  labels:
    io.kompose.service: frontend

  name: frontend
  namespace: photo-portfolio-website

spec:
  selector:
    io.kompose.service: frontend

  type: LoadBalancer

  externalTrafficPolicy: Local

  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
