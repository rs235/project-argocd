---
name: Argo CD Validation

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - README.md

  workflow_dispatch:

permissions:
  contents: read

jobs:
  yamllint:
    name: YAML Linting
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install yamllint
        run: pip install yamllint==1.38.0

      - name: Run yamllint
        run: yamllint --format github .

  gitleaks:
    name: Secrets Scan
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          # Temporary, automatically generated GitHub Token for GH API access.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    name: Security and Misconfiguration Scan
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: config
          severity: HIGH,CRITICAL
          exit-code: '1'

  kustomize-render:
    name: Kustomize Render
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d
        with:
          # kubectl version matched with server version.
          version: 'v1.35.4'

      - name: Create directory
        run: mkdir -p rendered/kustomize

      - name: Render manifests
        run: |
          kubectl kustomize applications/workloads/website > rendered/kustomize/website.yml

      - name: Upload rendered manifests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kustomize-rendered
          path: rendered/kustomize/
          if-no-files-found: error
          retention-days: 1

  kube-linter:
    name: Kubernetes Misconfiguration Scan
    runs-on: ubuntu-26.04
    needs:
      - kustomize-render

    steps:
      - name: Download Kustomize manifests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: kustomize-rendered
          path: rendered/kustomize

      - name: Run KubeLinter
        uses: stackrox/kube-linter-action@87802a2f4e01abebb3ee3c67a3002fea71f6eae5
        with:
          directory: rendered
          # config: .kube-linter.yml

  kubeconform-k8s:
    name: Kubernetes Schema Validation
    runs-on: ubuntu-26.04

    needs:
      - kustomize-render

    steps:
      - name: Download Kustomize manifests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: kustomize-rendered
          path: rendered/kustomize

      - name: Validate manifests
        uses: docker://ghcr.io/yannh/kubeconform:v0.8.0
        with:
          entrypoint: /kubeconform
          args: >-
            -strict
            -summary
            rendered/kustomize

  kubeconform-argocd:
    name: Argo CD Schema Validation
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate manifests
        uses: docker://ghcr.io/yannh/kubeconform:v0.8.0
        with:
          entrypoint: /kubeconform
          args: >-
            -debug
            -strict
            -summary
            -ignore-filename-pattern kustomization\.ya?ml
            -ignore-filename-pattern values.*\.ya?ml
            -schema-location default
            -schema-location "schemas/{{ .ResourceKind }}.json"
            applications/
            bootstrap/
            clusters/
            projects/
